name: Battery monitor

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: 'test = send a test alert, summary = send the daily summary now'
        type: choice
        options: [check, test, summary]
        default: check

concurrency:
  group: battery-monitor

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      # state.json remembers when each alert last fired, so alerts aren't repeated every run.
      - name: Restore alert state
        uses: actions/cache/restore@v4
        with:
          path: state.json
          key: alert-state-${{ github.run_id }}
          restore-keys: alert-state-

      - name: Run monitor
        shell: pwsh
        env:
          FOXESS_API_KEY: ${{ secrets.FOXESS_API_KEY }}
          AMBER_API_KEY: ${{ secrets.AMBER_API_KEY }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          FOXESS_SN: ${{ secrets.FOXESS_SN }}
          AMBER_SITE_ID: ${{ secrets.AMBER_SITE_ID }}
        run: |
          $mode = '${{ inputs.mode }}'
          if ($mode -eq 'test') { ./monitor.ps1 -Test }
          elseif ($mode -eq 'summary') { ./monitor.ps1 -ForceSummary }
          else { ./monitor.ps1 }

      - name: Save alert state
        if: always() && hashFiles('state.json') != ''
        uses: actions/cache/save@v4
        with:
          path: state.json
          key: alert-state-${{ github.run_id }}
